[package]
name = "mdl-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
jiff = "1"
mlua = { version = "0.12.2", features = ["lua51", "serde", "vendored"] }
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Smaller binaries to hand out: drop debug symbols.
strip = true
