# Cross-compiling a Windows .exe from WSL/Linux.
# One-time setup:  sudo apt install mingw-w64  &&  rustup target add x86_64-pc-windows-gnu
# Then:            cargo build --release --target x86_64-pc-windows-gnu
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
# Bake the C runtime bits in, so the .exe doesn't need mingw DLLs next to it.
rustflags = ["-C", "link-args=-static -static-libgcc"]
